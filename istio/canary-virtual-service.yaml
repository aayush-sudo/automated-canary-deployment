
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: canary-demo
  namespace: default
spec:
  hosts:
    - canary-demo.default.svc.cluster.local
  http:
    - route:
        - destination:
            host: canary-demo.default.svc.cluster.local
            subset: v1
            port:
              number: 5001
          weight: 80
        - destination:
            host: canary-demo.default.svc.cluster.local
            subset: v2
            port:
              number: 5001
          weight: 20
