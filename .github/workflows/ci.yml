name: Application CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run automated tests
        working-directory: app
        run: python -m pytest test_app.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build v1 Docker image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          tags: canary-demo:v1
          push: false
          load: true

      - name: Build v2 Docker image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          tags: canary-demo:v2
          push: false
          load: true
