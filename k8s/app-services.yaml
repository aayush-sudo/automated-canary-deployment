
apiVersion: v1
kind: Service
metadata:
  name: canary-demo-v1
  labels:
    app: canary-demo
    version: v1
spec:
  type: ClusterIP
  selector:
    app: canary-demo
    version: v1
  ports:
    - name: http
      port: 5001
      targetPort: http
